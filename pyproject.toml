[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-refinement"
version = "0.1.0"
description = "Paper code for orientation-aware duplicate-vertex refinement of rigged meshes"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/Budy123/Deformation-Aware-Mesh-Refinement"

[project.scripts]
mesh-refinement = "mesh_refinement.cli:main"

[tool.setuptools]
packages = ["mesh_refinement"]

[tool.setuptools.data-files]
"share/mesh-refinement" = ["README.md", "LICENSE", "NOTICE.md"]
"share/mesh-refinement/docs" = ["docs/usage.md", "docs/data_preparation.md", "docs/evaluation.md", "docs/testing.md", "docs/source_provenance.json"]
"share/mesh-refinement/scripts" = ["scripts/prepare_data.py"]
"share/mesh-refinement/examples/axl2_fish" = ["examples/axl2_fish/README.md", "examples/axl2_fish/input.npz", "examples/axl2_fish/mesh.obj", "examples/axl2_fish/preview.png", "examples/axl2_fish/provenance.json"]
"share/mesh-refinement/config" = ["config/fusion_config.yaml"]
"share/mesh-refinement/licenses" = ["licenses/Puppeteer-APACHE-2.0.txt"]
